<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<style>
  body { background: transparent; padding: 20px; }
  .sig-card { display: inline-block; margin: 15px; border: 1px dashed #ccc; padding: 10px; }
</style>
</head>
<body>

  <!-- Option 1: Bengali Cursive Calligraphy (মোঃ সাহাবুদ্দিন) -->
  <div id='sig1' class='sig-card'>
    <svg width='240' height='80' viewBox='0 0 240 80' xmlns='http://www.w3.org/2000/svg'>
      <!-- Smooth flowing fountain pen ink -->
      <g stroke='#0c2340' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'>
        <!-- মো: -->
        <path d='M 18,52 C 16,38 22,22 32,20 C 38,18 42,26 40,40 C 38,50 48,32 54,26 C 60,20 64,30 62,44 C 60,54 52,56 46,54' />
        <circle cx='68' cy='46' r='1.8' fill='#0c2340' />
        
        <!-- সা-হা-বু-দ্দি-ন artistic signature loops -->
        <!-- সা loop -->
        <path d='M 76,46 C 72,34 80,24 90,22 C 100,20 96,36 88,44 C 84,48 94,54 104,46 C 112,40 114,28 122,24' />
        <!-- হা & বু loops -->
        <path d='M 122,24 C 128,20 132,32 130,44 C 136,30 144,22 152,24 C 160,26 156,42 164,46 C 170,36 178,24 188,22' />
        <!-- দ্দিন flourish -->
        <path d='M 188,22 C 196,20 198,34 196,44 C 202,32 210,24 218,22 C 224,20 228,30 230,40' />
        
        <!-- Dynamic Underline sweeping left to right -->
        <path d='M 26,62 C 70,60 140,58 225,54 C 232,53 236,50 238,44' stroke-width='2.2' />
        <circle cx='126' cy='70' r='1.6' fill='#0c2340' />
        <circle cx='138' cy='70' r='1.6' fill='#0c2340' />
      </g>
    </svg>
  </div>

  <!-- Option 2: Executive English/Bengali Hybrid (Md. Sahabuddin) -->
  <div id='sig2' class='sig-card'>
    <svg width='240' height='80' viewBox='0 0 240 80' xmlns='http://www.w3.org/2000/svg'>
      <g stroke='#102a45' stroke-width='2.3' fill='none' stroke-linecap='round' stroke-linejoin='round'>
        <!-- M with sharp slant and loop -->
        <path d='M 16,56 L 24,18 L 36,44 L 48,16 L 56,48' />
        <circle cx='62' cy='48' r='1.6' fill='#102a45' />
        <!-- S capital flourish -->
        <path d='M 82,22 C 72,16 68,26 76,34 C 86,42 94,48 84,54 C 76,58 70,52 74,46' />
        <!-- habuddin flowing script -->
        <path d='M 88,44 C 92,30 96,20 102,20 C 108,20 106,36 112,46 C 118,34 126,28 134,30 C 142,32 140,46 148,46 C 156,36 166,28 174,28 C 182,28 180,44 190,44 C 198,34 206,26 216,24 C 224,22 226,38 228,48' />
        <!-- Bold underline with flourish loop -->
        <path d='M 20,64 C 65,63 130,61 210,57 C 224,56 230,48 224,42 C 216,36 212,50 220,54' stroke-width='2.0' />
      </g>
    </svg>
  </div>

</body>
</html>
